<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Virexa Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .btn-discord {
            background-color: #5865F2;
            /* Discord branding color */
            color: #fff;
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            font-size: 1rem;
        }

        .btn-discord:hover {
            opacity: 0.9;
        }

        .btn-discord svg {
            margin-right: 10px;
            fill: currentColor;
            width: 24px;
            height: 24px;
            margin-left: 0;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="card login-card">
            <h2 style="color: var(--accent-yellow); margin-bottom: 1rem;">Virexa</h2>
            <p style="margin-bottom: 2rem; color: var(--text-color); opacity: 0.8;">Professional Discord Moderation
                Dashboard</p>
            {% if error %}
            <div style="color: var(--accent-red); margin-bottom: 1rem; font-weight: 600;">{{ error }}</div>
            {% endif %}
            <button id="discord-login-btn" class="btn-discord">
                <svg viewBox="0 0 127.14 96.36">
                    <path
                        d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.31,60,73.31,53s5-12.74,11.43-12.74S96.2,46,96.12,53,91.08,65.69,84.69,65.69Z" />
                </svg>
                Login with Discord
            </button>
        </div>
    </div>

    <script>
        document.getElementById('discord-login-btn').addEventListener('click', async () => {
            try {
                const response = await fetch('/auth/discord/url');
                const data = await response.json();

                const width = 500;
                const height = 700;
                const left = window.screen.width / 2 - width / 2;
                const top = window.screen.height / 2 - height / 2;

                const popup = window.open(data.url, 'discordLoginPopup', `width=${width},height=${height},top=${top},left=${left}`);

                const checkPopup = setInterval(() => {
                    if (popup && popup.closed) {
                        clearInterval(checkPopup);
                    }
                }, 1000);

            } catch (err) {
                console.error("Failed to fetch Discord URL", err);
            }
        });

        window.addEventListener('message', (event) => {
            if (event.origin !== window.location.origin) return;

            if (event.data && event.data.status === 'success') {
                // Go to server selection page after successful login
                window.location.href = '/select_server';
            }
        });
    </script>
</body>

</html>
